# Tokyo Night — hand-authored static palette for kitty.
# Matches tmux/tokyonight.conf and starship.toml. Edit this file directly;
# it is NOT regenerated by matugen.
#
# Tokyo Night palette (github.com/folke/tokyonight.nvim):
#   bg             #1a1b26  base background (darkest variant)
#   bg_dark        #16161e  darker surface
#   bg_highlight   #292e42  raised surface (selection, messages)
#   terminal_black #414868  bright black / gutter
#   fg             #c0caf5  foreground
#   fg_dark        #a9b1d6  dimmed foreground
#   comment        #565f89  comments
#   blue           #7aa2f7  functions, active borders
#   blue1          #2ac3de  types, specials
#   blue5          #89ddff  operators
#   cyan           #7dcfff  keywords
#   green          #9ece6a  strings (no competing yellow in syntax)
#   green1         #73daca  properties, health
#   magenta        #bb9af7  identifiers, constructors
#   purple         #9d7cd8  keywords (treesitter)
#   orange         #ff9e64  constants, cursor line nr
#   red            #f7768e  errors, builtin variables
#   yellow         #e0af68  (remapped in nvim; kept here for ANSI compat)
#
# CVD note: green (#9ece6a) is a yellow-green but has NO yellow competitor
# in nvim syntax (yellow uses are remapped to orange/cyan). In terminal
# output, green and yellow ANSI colors differ by ~15% luminance.

# ── Surfaces & text ─────────────────────────────────────────
background              #1a1b26
foreground              #c0caf5

cursor                  #c0caf5
cursor_text_color       #1a1b26

selection_background    #283457
selection_foreground    #c0caf5

url_color               #73daca

# ── Window / tab UI ─────────────────────────────────────────
active_border_color     #7aa2f7
inactive_border_color   #292e42
bell_border_color       #f7768e

active_tab_background   #7aa2f7
active_tab_foreground   #16161e
inactive_tab_background #292e42
inactive_tab_foreground #545c7e
tab_bar_background      #1a1b26

