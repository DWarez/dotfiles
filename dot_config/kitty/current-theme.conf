# Graphite — hand-authored static metallic palette for kitty.
# Decoupled from matugen since 2026-07. Matches tmux/graphite.conf and
# starship.toml. Edit this file directly; it is NOT regenerated.
#
# Layered steel tones with a faint cool undertone:
#   surface        #16181c  deep graphite (background)
#   surface_high   #23262c  raised graphite (selection, inactive tabs)
#   primary        #8b939e  mid steel (cursor, active border)
#   tertiary       #d4dae0  pale steel (active tab — metallic sheen)
#   on_surface     #c2c8cf  cool off-white (foreground)
#   on_surface_var #6e7682  slate (inactive tab text)
#   outline        #3a4148  dark streak (inactive border)

# ── Surfaces & text ─────────────────────────────────────────
background              #16181c
foreground              #c2c8cf

cursor                  #8b939e
cursor_text_color       #16181c

selection_background    #23262c
selection_foreground    #d4dae0

url_color               #8b939e

# ── Window / tab UI ─────────────────────────────────────────
active_border_color     #8b939e
inactive_border_color   #3a4148
bell_border_color       #c4746e

active_tab_background   #d4dae0
active_tab_foreground   #16181c
inactive_tab_background #23262c
inactive_tab_foreground #6e7682
tab_bar_background      #16181c

# ── 16 ANSI colours (graphite-tinted neutral ramp) ─────────
# Kept as a restrained neutral set so terminal output (ls, syntax, TUIs)
# stays legible without introducing competing hues. Where a real colour
# is needed (errors, warnings), muted versions preserve the graphite mood.
# black
color0  #16181c
color8  #6e7682
# red
color1  #c4746e
color9  #d9877f
# green
color2  #8b939e
color10 #a3abb5
# yellow
color3  #d4dae0
color11 #e2e6ea
# blue
color4  #6e7682
color12 #8b939e
# magenta
color5  #9a8b9e
color13 #ab9caf
# cyan
color6  #7a8b94
color14 #8fa0a8
# white
color7  #c2c8cf
color15 #e2e6ea
# extended
color16 #d4dae0
color17 #c4746e
