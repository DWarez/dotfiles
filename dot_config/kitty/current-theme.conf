# Rose Pine — hand-authored static palette for kitty.
# Matches tmux/rose-pine.conf and starship.toml. Edit this file directly;
# it is NOT regenerated by matugen.
#
# Rosé Pine palette (rosepinetheme.com):
#   base           #191724  base surface (background)
#   surface        #1f1d2e  raised surface (selection, inactive tabs)
#   overlay        #26233a  overlay (inactive border)
#   muted          #6e6a86  muted text (inactive tab text)
#   subtle         #908caa  subtle text
#   text           #e0def4  foreground
#   love           #eb6f92  rose-red (errors, bell)
#   gold           #f6c177  gold (selection text, active tab)
#   pine           #31748f  pine-teal (cursor, active border)
#   foam           #9ccfd8  foam-cyan
#   iris           #c4a7e7  iris-purple (URLs)
#   rose           #ebbcba  rose-pink
#   highlight_med  #403d52  selection background

# ── Surfaces & text ─────────────────────────────────────────
background              #191724
foreground              #e0def4

cursor                  #524f67
cursor_text_color       #e0def4

selection_background    #403d52
selection_foreground    #e0def4

url_color               #c4a7e7

# ── Window / tab UI ─────────────────────────────────────────
active_border_color     #31748f
inactive_border_color   #403d52
bell_border_color       #eb6f92

active_tab_background   #26233a
active_tab_foreground   #e0def4
inactive_tab_background #191724
inactive_tab_foreground #6e6a86
tab_bar_background      #191724

# ── 16 ANSI colours (Rose Pine) ─────────────────────────────
# Distinct hue families for CVD safety: no green-yellow competition.
# pine (#31748f) is teal-blue, gold (#f6c177) is warm amber —
# maximally separated in both hue and luminance.
# black
color0  #26233a
color8  #6e6a86
# red
color1  #eb6f92
color9  #eb6f92
# green (pine teal — NOT a true green, CVD-safe)
color2  #31748f
color10 #31748f
# yellow (gold)
color3  #f6c177
color11 #f6c177
# blue (foam)
color4  #9ccfd8
color12 #9ccfd8
# magenta (iris)
color5  #c4a7e7
color13 #c4a7e7
# cyan (rose)
color6  #ebbcba
color14 #ebbcba
# white
color7  #e0def4
color15 #e0def4
# extended
color16 #f6c177
color17 #eb6f92
