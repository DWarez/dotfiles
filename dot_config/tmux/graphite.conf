# ──────────────────────────────────────────────────────────────
# Graphite — hand-authored static metallic palette for tmux.
# Decoupled from matugen (kitty/starship keep their own matugen themes).
# Sourced last by tmux.conf, overrides all prior styling.
#
# Layered steel tones with a faint cool undertone:
#   surface        #16181c  deep graphite (charcoal base)
#   surface_high   #23262c  raised graphite (messages)
#   primary        #8b939e  mid steel (session pill, active border)
#   tertiary       #d4dae0  pale steel — the metallic sheen (active tab, clock)
#   on_surface     #c2c8cf  cool off-white (text)
#   on_surface_var #6e7682  slate (muted text)
#   outline        #3a4148  dark streak (inactive borders)
#
# Glassy: base surfaces are transparent (bg=default) so kitty's
# background_blur shows through; only active accent pills are opaque.
# ──────────────────────────────────────────────────────────────

# ── Status bar ──────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#c2c8cf"

# ── Left: session name, with a prefix-active indicator ──────
set -g status-left-length 60
set -g status-left "#[fg=#16181c,bg=#8b939e,bold] #S #[fg=#8b939e,bg=default]#{?client_prefix,#[fg=#d4dae0] ● ,} "

# ── Windows: subtle when inactive, accented when focused ────
set -g window-status-separator ""
set -g window-status-format "#[fg=#6e7682,bg=default]  #I:#W  "
set -g window-status-current-format "#[fg=#16181c,bg=#d4dae0,bold]  #I:#W#{?window_zoomed_flag, ,}  "

# ── Right: current path + clock ─────────────────────────────
set -g status-right-length 120
set -g status-right "#[fg=#3a4148,bg=default] ? help #[fg=#c2c8cf] #{b:pane_current_path} #[fg=#16181c,bg=#d4dae0] 󰥔 %H:%M "

# ── Panes ───────────────────────────────────────────────────
set -g pane-border-style "fg=#3a4148"
set -g pane-active-border-style "fg=#8b939e"

# ── Messages / copy-mode ────────────────────────────────────
# `fill` is REQUIRED on tmux 3.7+ (issue #4861): without it the command
# prompt overlays the status content instead of replacing it, making the
# completion menu unreadable and tab names bleed through.
set -g message-style "bg=#23262c,fg=#d4dae0,fill=#23262c"
set -g message-command-style "bg=#23262c,fg=#8b939e,fill=#23262c"
set -g mode-style "bg=#d4dae0,fg=#16181c"

# ── Clock ───────────────────────────────────────────────────
setw -g clock-mode-colour "#8b939e"
