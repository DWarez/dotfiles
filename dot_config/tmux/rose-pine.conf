# ──────────────────────────────────────────────────────────────
# Rose Pine — hand-authored static palette for tmux.
# Sourced last by tmux.conf, overrides all prior styling.
# Matches kitty/current-theme.conf and starship.toml.
#
# Rosé Pine palette (rosepinetheme.com):
#   base           #191724  base surface (background)
#   surface        #1f1d2e  raised surface (messages)
#   overlay        #26233a  overlay (inactive borders)
#   muted          #6e6a86  muted text
#   text           #e0def4  foreground
#   love           #eb6f92  rose-red (prefix indicator)
#   gold           #f6c177  gold (active tab, clock)
#   pine           #31748f  pine-teal (active border, session pill)
#   iris           #c4a7e7  iris-purple
#   rose           #ebbcba  rose-pink
#   highlight_med  #403d52  message background
#
# Glassy: base surfaces are transparent (bg=default) so kitty's
# background_blur shows through; only active accent pills are opaque.
# ──────────────────────────────────────────────────────────────

# ── Status bar ──────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#e0def4"

# ── Left: session name, with a prefix-active indicator ──────
set -g status-left-length 60
set -g status-left "#[fg=#191724,bg=#31748f,bold] #S #[fg=#31748f,bg=default]#{?client_prefix,#[fg=#eb6f92] ● ,} "

# ── Windows: subtle when inactive, accented when focused ────
set -g window-status-separator ""
set -g window-status-format "#[fg=#6e6a86,bg=default]  #I:#W  "
set -g window-status-current-format "#[fg=#191724,bg=#f6c177,bold]  #I:#W#{?window_zoomed_flag, ,}  "

# ── Right: current path + clock ─────────────────────────────
set -g status-right-length 120
set -g status-right "#[fg=#26233a,bg=default] ? help #[fg=#e0def4] #{b:pane_current_path} #[fg=#191724,bg=#f6c177] 󰥔 %H:%M "

# ── Panes ───────────────────────────────────────────────────
set -g pane-border-style "fg=#26233a"
set -g pane-active-border-style "fg=#31748f"

# ── Messages / copy-mode ────────────────────────────────────
# `fill` is REQUIRED on tmux 3.7+ (issue #4861): without it the command
# prompt overlays the status content instead of replacing it, making the
# completion menu unreadable and tab names bleed through.
set -g message-style "bg=#1f1d2e,fg=#e0def4,fill=#1f1d2e"
set -g message-command-style "bg=#1f1d2e,fg=#31748f,fill=#1f1d2e"
set -g mode-style "bg=#f6c177,fg=#191724"

# ── Clock ───────────────────────────────────────────────────
setw -g clock-mode-colour "#31748f"
