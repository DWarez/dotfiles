# ──────────────────────────────────────────────────────────────
# Tokyo Night — hand-authored static palette for tmux.
# Sourced last by tmux.conf, overrides all prior styling.
# Matches kitty/current-theme.conf and starship.toml.
#
# Tokyo Night palette (github.com/folke/tokyonight.nvim):
#   bg             #1a1b26  base background
#   bg_highlight   #292e42  raised surface (messages)
#   terminal_black #414868  inactive borders
#   fg             #c0caf5  foreground
#   fg_dark        #a9b1d6  dimmed text
#   blue           #7aa2f7  active border, session pill
#   green          #9ece6a  active tab
#   cyan           #7dcfff  prefix indicator
#   magenta        #bb9af7  clock accent
#   orange         #ff9e64  cursor line / path
#   red            #f7768e  errors
#
# Glassy: base surfaces are transparent (bg=default) so kitty's
# background_blur shows through; only active accent pills are opaque.
# ──────────────────────────────────────────────────────────────

# ── Status bar ──────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#c0caf5"

# ── Left: session name, with a prefix-active indicator ──────
set -g status-left-length 60
set -g status-left "#[fg=#16161e,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=default]#{?client_prefix,#[fg=#7dcfff] ● ,} "

# ── Windows: subtle when inactive, accented when focused ────
set -g window-status-separator ""
set -g window-status-format "#[fg=#545c7e,bg=default]  #I:#W  "
set -g window-status-current-format "#[fg=#16161e,bg=#7aa2f7,bold]  #I:#W#{?window_zoomed_flag, ,}  "

# ── Right: current path + clock ─────────────────────────────
set -g status-right-length 120
set -g status-right "#[fg=#414868,bg=default] ? help #[fg=#c0caf5] #{b:pane_current_path} #[fg=#16161e,bg=#bb9af7] 󰥔 %H:%M "

# ── Panes ───────────────────────────────────────────────────
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"

# ── Messages / copy-mode ────────────────────────────────────
# `fill` is REQUIRED on tmux 3.7+ (issue #4861): without it the command
# prompt overlays the status content instead of replacing it, making the
# completion menu unreadable and tab names bleed through.
set -g message-style "bg=#292e42,fg=#c0caf5,fill=#292e42"
set -g message-command-style "bg=#292e42,fg=#7aa2f7,fill=#292e42"
set -g mode-style "bg=#7aa2f7,fg=#16161e"

# ── Clock ───────────────────────────────────────────────────
setw -g clock-mode-colour "#7aa2f7"
